# ═══════════════════════════════════════════════════════
# GIFT SYSTEM
# ═══════════════════════════════════════════════════════
gift:
  max-pending: 5

# ═══════════════════════════════════════════════════════
# PARTNER EFFECTS (Particle)
# ═══════════════════════════════════════════════════════
partner-effects:
  enabled: false
  interval-ticks: 60          # 60 ticks = 3 seconds
  max-distance: 10.0          # Max radius for particles

# ═══════════════════════════════════════════════════════
# PARTNER TITLES (PlaceholderAPI)
# ═══════════════════════════════════════════════════════
partner-titles:
  enabled: false
  format: "&d[{title}] "
  titles:
    1: "Partner"
    5: "Close"
    10: "Bonded"
    15: "Bestie"
    20: "Soulmate"
    25: "Eternal"

# ═══════════════════════════════════════════════════════
# PARTNER HOME
# ═══════════════════════════════════════════════════════
partner-home:
  enabled: true
  min-level: 3                # Minimum level to set home
  warmup-seconds: 3           # Stand still before teleport
  cooldown-seconds: 60        # Cooldown between teleports

# ═══════════════════════════════════════════════════════
# DAILY LOGIN STREAK
# ═══════════════════════════════════════════════════════
login-streak:
  enabled: true
  base-bonus-xp: 25           # XP bonus per streak level
  max-streak: 7               # Max streak (7 days = 175 XP)

# ═══════════════════════════════════════════════════════
# PRESTIGE SYSTEM
# ═══════════════════════════════════════════════════════
prestige:
  enabled: true
  min-partnership-level: 50
  min-days-active: 30
  xp-bonus-per-prestige: 5.0  # Percentage XP boost per prestige level
  max-prestige: -1            # -1 = unlimited

# ═══════════════════════════════════════════════════════
# ANNIVERSARY CELEBRATION
# ═══════════════════════════════════════════════════════
anniversary:
  enabled: true

# ═══════════════════════════════════════════════════════
# SEASONAL EVENTS
# ═══════════════════════════════════════════════════════
events:
  valentines:
    enabled: true
    dates: "Feb 10-16"
    love_quest_xp_multiplier: 5.0